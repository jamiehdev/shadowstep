apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadowstep
  labels:
    app: shadowstep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shadowstep
  template:
    metadata:
      labels:
        app: shadowstep
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: shadowstep
        image: ghcr.io/jamiehdev/shadowstep:2.0.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        ports:
        - name: http
          containerPort: 8080
        # must match the port in TLS_LISTEN_ADDR below
        - name: https
          containerPort: 8443
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: ORIGIN_URL
          value: "http://origin.example.com" # replace with your upstream
        - name: LISTEN_ADDR
          value: "0.0.0.0:8080"
        - name: TLS_CERT_PATH
          value: "/etc/tls/tls.crt"
        - name: TLS_KEY_PATH
          value: "/etc/tls/tls.key"
        - name: TLS_LISTEN_ADDR
          value: "0.0.0.0:8443"
        # the cache holds up to this many MiB in memory, so keep it well under
        # the memory limit above
        - name: CACHE_SIZE_MB
          value: "100"
        # /app/assets is not mounted over: the image ships the assets it serves
        volumeMounts:
        - name: tls
          mountPath: "/etc/tls"
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      # a kubernetes.io/tls Secret; the key must be PKCS#8 (see README)
      - name: tls
        secret:
          secretName: shadowstep-tls
