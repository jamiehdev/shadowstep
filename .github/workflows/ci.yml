name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # the scope matches the linux/amd64 job in release.yml, so a release
      # build reuses the layers cached from main
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: shadowstep:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Check the image serves /health as uid 1000
        run: |
          test "$(docker run --rm --entrypoint id shadowstep:ci -u)" = 1000
          docker run -d --name shadowstep -p 8080:8080 shadowstep:ci --origin-url http://127.0.0.1:9
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then
              docker rm -f shadowstep
              exit 0
            fi
            sleep 1
          done
          docker logs shadowstep
          exit 1
